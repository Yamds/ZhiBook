<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：Android 15+ edge-to-edge 下让 env(safe-area-inset-*) 生效；
         双指缩放固定关闭（记账界面不许误触缩放），原生侧 MainActivity 同步 setSupportZoom(false) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#211f1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>制账</title>
    <!-- JS/CSS 到达前避免 WebView 闪屏：
         ① 默认底色 + 系统深色兜底（还没跑过任何 JS 时只能看系统偏好）；
         ② 引导脚本读 localStorage 里镜像的画布色与主题，把用户选的主题提前落到位 ——
            否则「系统浅色 + 选了暗色主题」的机器开机必然闪一帧白底。
            只读色值与主题名，新主题不需要回来改这里。 -->
    <script>
      (function () {
        try {
          var canvas = localStorage.getItem('yamds-bill:canvas');
          if (canvas) {
            document.documentElement.style.backgroundColor = canvas;
            var rootEl = document.getElementById('root');
            if (rootEl) rootEl.style.backgroundColor = canvas;
          }
          var raw = localStorage.getItem('yamds-bill:preferences:v1');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme && theme !== 'auto') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          /* 隐私模式 / 脏数据：保持系统兜底即可 */
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #faf7f2;
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]),
        html:not([data-theme]) body,
        html:not([data-theme]) #root {
          background: #211f1d !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root" aria-busy="true" style="background-color: #faf7f2;"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
