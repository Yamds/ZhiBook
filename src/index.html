<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：Android 15+ edge-to-edge 下让 env(safe-area-inset-*) 生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#211f1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>制账</title>
    <!-- JS/CSS 到达前避免 WebView 闪屏；暗色系统用深底，与 tokens surface-canvas 对齐 -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #faf7f2;
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]):not([data-theme="latte"]),
        html:not([data-theme="light"]):not([data-theme="latte"]) body,
        html:not([data-theme="light"]):not([data-theme="latte"]) #root {
          background: #211f1d !important;
        }
      }

      html[data-theme="dark"],
      html[data-theme="frappe"],
      html[data-theme="macchiato"] {
        background: #211f1d;
      }

      html[data-theme="dark"] body,
      html[data-theme="frappe"] body,
      html[data-theme="macchiato"] body,
      html[data-theme="dark"] #root,
      html[data-theme="frappe"] #root,
      html[data-theme="macchiato"] #root {
        background: #211f1d !important;
      }

      html[data-theme="mocha"] {
        background: #1e1e2e;
      }

      html[data-theme="mocha"] body,
      html[data-theme="mocha"] #root {
        background: #1e1e2e !important;
      }
    </style>
  </head>
  <body>
    <div id="root" aria-busy="true" style="background-color: #faf7f2;"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
