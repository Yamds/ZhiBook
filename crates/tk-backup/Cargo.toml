[package]
name = "tk-backup"
description = "数据导入导出：JSON + ZIP 备份包（manifest.json + data.json + attachments/**）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tk-config = { path = "../tk-config" }
tk-domain = { path = "../tk-domain" }
tk-ledger = { path = "../tk-ledger" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.37", default-features = false }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 只用于「导入附件落位失败」这类非致命告警；与 tk-config 同一个 tracing 实例，不增体积。
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
