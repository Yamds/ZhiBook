[package]
name = "tk-crypto"
description = "云端备份加密：XChaCha20-Poly1305 / Argon2id 口令包装 / 恢复密钥（纯逻辑，无文件 IO）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tk-domain = { path = "../tk-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
argon2 = "0.5"
base32 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
